<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="ns-all-licenses"
     data-verified="{f:if(condition: allLicensesVerified, then: '1', else: '0')}"
     data-email="{allLicensesEmail}"
     data-labels-empty="{f:translate(key: 'license-all-licenses.empty', extensionName: 'ns_license')}"
     data-labels-empty-filtered="{f:translate(key: 'license-all-licenses.empty_filtered', extensionName: 'ns_license')}"
     data-labels-domains-empty="{f:translate(key: 'license-all-licenses.domains.empty', extensionName: 'ns_license')}"
     data-labels-lifetime="{f:translate(key: 'license-all-licenses.lifetime', extensionName: 'ns_license')}"
     data-labels-status-active="{f:translate(key: 'license-all-licenses.status.active', extensionName: 'ns_license')}"
     data-labels-status-expired="{f:translate(key: 'license-all-licenses.status.expired', extensionName: 'ns_license')}"
     data-labels-status-inactive="{f:translate(key: 'license-all-licenses.status.inactive', extensionName: 'ns_license')}"
     data-labels-status-complete="{f:translate(key: 'license-activation.badge.licensed', extensionName: 'ns_license')}"
     data-labels-status-existing="{f:translate(key: 'license-all-licenses.status.existing', extensionName: 'ns_license')}"
     data-labels-status-pending="{f:translate(key: 'license-all-licenses.status.pending', extensionName: 'ns_license')}"
     data-labels-status-otp-verified="{f:translate(key: 'license-all-licenses.status.otp_verified', extensionName: 'ns_license')}"
     data-labels-status-trial-started="{f:translate(key: 'license-all-licenses.status.trial_started', extensionName: 'ns_license')}"
     data-labels-cancellation-button="{f:translate(key: 'license-all-licenses.button.cancellation', extensionName: 'ns_license')}"
     data-labels-env-production="{f:translate(key: 'license-domains.filter.environment.production', extensionName: 'ns_license')}"
     data-labels-env-staging="{f:translate(key: 'license-domains.filter.environment.staging', extensionName: 'ns_license')}"
     data-labels-env-local="{f:translate(key: 'license-domains.filter.environment.local', extensionName: 'ns_license')}"
     data-labels-otp-sent-to="{f:translate(key: 'license-all-licenses.otp.sent_to', extensionName: 'ns_license')}"
     data-labels-otp-invalid="{f:translate(key: 'license-all-licenses.error.otp', extensionName: 'ns_license')}"
     data-labels-otp-resend-prompt="{f:translate(key: 'license-all-licenses.otp.resend.prompt', extensionName: 'ns_license')}"
     data-labels-view-domains="{f:translate(key: 'license-all-licenses.button.view_domains', extensionName: 'ns_license')}"
     data-labels-license-key="{f:translate(key: 'license-all-licenses.column.license_key', extensionName: 'ns_license')}"
     data-labels-copy="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}"
     data-labels-copied="{f:translate(key: 'license-catalog.detail.composer.copied', extensionName: 'ns_license')}"
     data-labels-renew="{f:translate(key: 'license.renew', extensionName: 'ns_license')}"
     data-labels-summary="{f:translate(key: 'license-all-licenses.summary', extensionName: 'ns_license')}"
     data-labels-summary-expiring="{f:translate(key: 'license-all-licenses.summary.expiring', extensionName: 'ns_license')}"
     data-labels-badge-total="{f:translate(key: 'license-all-licenses.badge.total', extensionName: 'ns_license')}"
     data-labels-badge-active="{f:translate(key: 'license-all-licenses.badge.active', extensionName: 'ns_license')}"
     data-labels-badge-expiring="{f:translate(key: 'license-all-licenses.badge.expiring', extensionName: 'ns_license')}"
     data-table-colspan="8"
     data-js-table-version="7">

    <div class="ns-all-licenses__otp" data-all-licenses-otp style="{f:if(condition: allLicensesVerified, then: 'display:none', else: '')}">
        <div class="card card-size-large custom-card mb-3">
            <div class="card-header">
                <div class="card-header-body">
                    <h2 class="card-title mb-1"><f:translate key="license-all-licenses.verify.title" extensionName="ns_license" /></h2>
                    <p class="text-variant mb-0"><f:translate key="license-all-licenses.verify.description" extensionName="ns_license" /></p>
                </div>
            </div>
            <div class="card-body">
                <div class="ns-all-licenses__alert alert alert-danger d-none" data-all-licenses-error role="alert"></div>

                <div class="mb-3" data-all-licenses-email-step>
                    <label class="form-label" for="all-licenses-email"><f:translate key="license-all-licenses.email.label" extensionName="ns_license" /></label>
                    <div class="d-flex flex-wrap gap-2 align-items-start">
                        <input type="email" class="form-control" id="all-licenses-email" name="all_licenses_email" autocomplete="email" required
                               placeholder="{f:translate(key: 'license-all-licenses.email.placeholder', extensionName: 'ns_license')}"
                               value="{allLicensesEmail}" style="max-width: 28rem;" />
                        <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-1" data-all-licenses-send-otp>
                            <core:icon identifier="actions-envelope" size="small" alternativeMarkupIdentifier="inline" />
                            <span data-all-licenses-send-label><f:translate key="license-all-licenses.button.send_otp" extensionName="ns_license" /></span>
                            <span class="d-none" data-all-licenses-send-loading><f:translate key="license-all-licenses.button.sending" extensionName="ns_license" /></span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="ns-all-licenses__results" data-all-licenses-results style="{f:if(condition: allLicensesVerified, then: '', else: 'display:none')}">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h3 class="mb-2 text-secondary">
                    <f:translate key="license-all-licenses.verified_as" extensionName="ns_license" />
                    <strong data-all-licenses-verified-email>{allLicensesEmail}</strong>
                </h3>
                <div class="d-flex flex-wrap align-items-center gap-1 mt-1" data-all-licenses-summary>
                    <f:if condition="{allLicensesVerified}">
                        <span class="badge badge-default"><f:translate key="license-all-licenses.badge.total" arguments="{0: allLicensesSummary.total}" extensionName="ns_license" /></span>
                        <span class="badge badge-success"><f:translate key="license-all-licenses.badge.active" arguments="{0: allLicensesSummary.active}" extensionName="ns_license" /></span>
                        <f:if condition="{allLicensesSummary.expiringSoon}">
                            <span class="badge badge-warning"><f:translate key="license-all-licenses.badge.expiring" arguments="{0: allLicensesSummary.expiringSoon}" extensionName="ns_license" /></span>
                        </f:if>
                    </f:if>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-default d-inline-flex align-items-center gap-1" data-all-licenses-refresh>
                    <core:icon identifier="actions-refresh" size="small" alternativeMarkupIdentifier="inline" />
                    <span><f:translate key="license-all-licenses.button.refresh" extensionName="ns_license" /></span>
                </button>
                <button type="button" class="btn btn-default" data-all-licenses-switch-email>
                    <f:translate key="license-all-licenses.button.switch_email" extensionName="ns_license" />
                </button>
            </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-3 ns-all-licenses-toolbar" data-all-licenses-toolbar>
            <div class="ns-all-licenses-toolbar__search">
                <label class="visually-hidden" for="all-licenses-search"><f:translate key="license-all-licenses.search.placeholder" extensionName="ns_license" /></label>
                <input type="search"
                       class="form-control"
                       id="all-licenses-search"
                       data-all-licenses-search
                       placeholder="{f:translate(key: 'license-all-licenses.search.placeholder', extensionName: 'ns_license')}"
                       autocomplete="off" />
            </div>
            <div>
                <label class="visually-hidden" for="all-licenses-status-filter"><f:translate key="license-all-licenses.column.status" extensionName="ns_license" /></label>
                <select class="form-select" id="all-licenses-status-filter" data-all-licenses-status style="min-width: 12rem;">
                    <option value=""><f:translate key="license-all-licenses.tab.all" extensionName="ns_license" /></option>
                    <option value="complete"><f:translate key="license-activation.badge.licensed" extensionName="ns_license" /></option>
                    <option value="trial_started"><f:translate key="license-all-licenses.filter.trial" extensionName="ns_license" /></option>
                    <option value="inactive,existing,otp_verified"><f:translate key="license-all-licenses.filter.attention" extensionName="ns_license" /></option>
                    <option value="expired"><f:translate key="license-all-licenses.status.expired" extensionName="ns_license" /></option>
                    <option value="pending"><f:translate key="license-all-licenses.status.pending" extensionName="ns_license" /></option>
                </select>
            </div>
            <button type="button" class="btn btn-default d-inline-flex align-items-center gap-1" data-all-licenses-export-csv>
                <core:icon identifier="actions-download" size="small" alternativeMarkupIdentifier="inline" />
                <span><f:translate key="license-all-licenses.button.export_csv" extensionName="ns_license" /></span>
            </button>
        </div>

            <div class="table-fit">
                    <table class="table table-striped table-hover" data-all-licenses-table>
                        <thead>
                    <tr>
                        <th><f:translate key="license-all-licenses.column.product" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.composer_username" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.license_key" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.latest_version" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.expiry" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.status" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.production_domain" extensionName="ns_license" /></th>
                        <th><f:translate key="license-all-licenses.column.actions" extensionName="ns_license" /></th>
                    </tr>
                        </thead>
                <tbody data-all-licenses-tbody>
                    <f:if condition="{allLicensesVerified}">
                        <f:if condition="{allLicenses}">
                            <f:then>
                                <f:for each="{allLicenses}" as="license">
                                    <tr>
                                        <td>
                                            <div class="fw-semibold">{f:if(condition: license.title, then: license.title, else: license.extensionKey)}</div>
                                            <div class="small text-variant">{license.extensionKey}</div>
                                        </td>
                                        <td>
                                            <f:if condition="{license.composerUsername}">
                                                <f:then>
                                                    <span class="ns-all-licenses-copycell ns-all-licenses-copycell--user">
                                                        <code class="ns-all-licenses-clip" title="{license.composerUsername}">{license.composerUsername}</code>
                                                        <button type="button" class="btn btn-default btn-sm ns-all-licenses-copy" data-all-licenses-copy="{license.composerUsername}" title="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}" aria-label="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}">
                                                            <core:icon identifier="actions-edit-copy" size="small" />
                                                        </button>
                                                    </span>
                                                </f:then>
                                                <f:else><span class="text-variant">—</span></f:else>
                                            </f:if>
                                        </td>
                                        <td>
                                            <span class="ns-all-licenses-copycell ns-all-licenses-copycell--key">
                                                <code class="ns-all-licenses-clip" title="{license.licenseKey}">{license.licenseKey}</code>
                                                <button type="button" class="btn btn-default btn-sm ns-all-licenses-copy" data-all-licenses-copy="{license.licenseKey}" title="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}" aria-label="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}">
                                                    <core:icon identifier="actions-edit-copy" size="small" />
                                                </button>
                                            </span>
                                        </td>
                                        <td>{license.latestVersion}</td>
                                        <td>{license.validUntilFormatted}</td>
                                        <td>
                                            <f:switch expression="{license.status}">
                                                <f:case value="complete">
                                                    <span class="badge badge-success"><f:translate key="license-activation.badge.licensed" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:case value="existing">
                                                    <span class="badge badge-default"><f:translate key="license-all-licenses.status.existing" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:case value="pending">
                                                    <span class="badge badge-default"><f:translate key="license-all-licenses.status.pending" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:case value="trial_started">
                                                    <span class="badge badge-info"><f:translate key="license-all-licenses.status.trial_started" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:case value="expired">
                                                    <span class="badge badge-danger"><f:translate key="license-all-licenses.status.expired" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:case value="inactive">
                                                    <span class="badge badge-default"><f:translate key="license-all-licenses.status.inactive" extensionName="ns_license" /></span>
                                                </f:case>
                                                <f:defaultCase>
                                                    <span class="badge badge-default">{license.status}</span>
                                                </f:defaultCase>
                                            </f:switch>
                                        </td>
                                        <td>
                                            <f:if condition="{license.primaryDomain}">
                                                <f:then>
                                                    <span class="ns-all-licenses-copycell ns-all-licenses-copycell--domain">
                                                        <code class="ns-all-licenses-clip" title="{license.primaryDomain}">{license.primaryDomain}</code>
                                                        <button type="button" class="btn btn-default btn-sm ns-all-licenses-copy" data-all-licenses-copy="{license.primaryDomain}" title="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}" aria-label="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}">
                                                            <core:icon identifier="actions-edit-copy" size="small" />
                                                        </button>
                                                    </span>
                                                </f:then>
                                                <f:else><span class="text-variant">—</span></f:else>
                                            </f:if>
                                        </td>
                                        <td>
                                            <div class="d-flex flex-nowrap gap-1">
                                                <f:if condition="{license.status} == 'expired' || {license.status} == 'inactive'">
                                                    <button type="button"
                                                            class="btn btn-default btn-sm js-license-renew-trigger"
                                                            data-days="{license.expirationDays}"
                                                            data-expiration-date="{license.expirationDate}">
                                                        <f:translate key="license.renew" extensionName="ns_license" />
                                                    </button>
                                                </f:if>

                                                <f:if condition="{license.status} == 'complete'">
                                                    <button type="button"
                                                            class="btn btn-default btn-sm js-license-cancellation-trigger">
                                                        <f:translate key="license-all-licenses.button.cancellation" extensionName="ns_license" />
                                                    </button>
                                                </f:if>

                                                <button type="button"
                                                        class="btn btn-default btn-sm t3js-all-licenses-domains"
                                                        data-license-key="{license.licenseKey}"
                                                        data-title="{license.title}"
                                                        data-extension-key="{license.extensionKey}"
                                                        data-domains="{license.domains}"
                                                        data-local-domains="{license.localDomains}"
                                                        data-staging-domains="{license.stagingDomains}"
                                                        data-domains-used="{license.domainsUsed}">
                                                    <f:translate key="license-all-licenses.button.view_domains" extensionName="ns_license" />
                                                    ({license.domainsUsed})
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </f:for>
                            </f:then>
                            <f:else>
                                <tr data-all-licenses-empty-row>
                                    <td colspan="8" class="text-variant"><f:translate key="license-all-licenses.empty" extensionName="ns_license" /></td>
                                </tr>
                            </f:else>
                        </f:if>
                    </f:if>
                </tbody>
                    </table>
                </div>

    </div>

    <f:if condition="{allLicensesVerified}">
        <script type="application/json" data-all-licenses-initial><f:format.raw><f:format.json value="{allLicenses}" /></f:format.raw></script>
        <script type="application/json" data-all-licenses-initial-summary><f:format.raw><f:format.json value="{allLicensesSummary}" /></f:format.raw></script>
    </f:if>
</div>

<div id="all-licenses-domains-modal" class="t3js-modal modal fade modal-type-default modal-severity-default modal-style-default ns-license-modal ns-all-licenses-domains-modal modal-size-small position-fixed top-50 start-50 translate-middle right-0 left-0 p-0 border-0" tabindex="-1" data-bs-keyboard="true">
    <div class="modal-dialog">
        <div class="t3js-modal-content modal-content">
            <div class="modal-header">
                <h4 class="t3js-modal-title modal-title">
                    <div class="modal-ext-name-content">
                        <h2 class="modal-ext-name mb-0" data-all-licenses-domains-title></h2>
                        <span class="text-variant"><f:translate key="license-all-licenses.domains.modal_title" extensionName="ns_license" /></span>
                    </div>
                </h4>
                <button type="button" class="t3js-modal-close close bg-transparent border-0" data-bs-dismiss="modal" aria-label="Close">
                    <core:icon identifier="actions-close" size="small" />
                </button>
            </div>
            <div class="t3js-modal-body modal-body">
                <div class="mb-3 ns-all-licenses-domains-key">
                    <label class="form-label ns-all-licenses-domains-key__label"><f:translate key="license-all-licenses.column.license_key" extensionName="ns_license" /></label>
                    <div data-all-licenses-domains-key></div>
                </div>
                <div data-all-licenses-domains-body></div>
            </div>
            <div class="t3js-modal-footer modal-footer">
                <button type="button" class="btn btn-default" data-bs-dismiss="modal">
                    <f:translate key="license-activation.update_extension_btn_cancel" extensionName="ns_license" />
                </button>
            </div>
        </div>
    </div>
</div>

<div id="all-licenses-otp-modal" class="t3js-modal modal fade modal-type-default modal-severity-default modal-style-default ns-license-modal ns-all-licenses-otp-modal modal-size-small position-fixed top-50 start-50 translate-middle right-0 left-0 p-0 border-0" tabindex="-1" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog">
        <div class="t3js-modal-content modal-content">
            <div class="modal-header">
                <h4 class="t3js-modal-title modal-title">
                    <f:translate key="license-all-licenses.otp.modal.title" extensionName="ns_license" />
                </h4>
                <button type="button" class="t3js-modal-close close bg-transparent border-0" data-bs-dismiss="modal" aria-label="Close">
                    <core:icon identifier="actions-close" size="small" />
                </button>
            </div>
            <div class="t3js-modal-body modal-body">
                <p class="mb-3" data-all-licenses-otp-hint></p>
                <div class="ns-all-licenses__alert alert alert-danger d-none mb-3" data-all-licenses-otp-error role="alert"></div>
                <label class="form-label visually-hidden" for="all-licenses-otp-digit-0"><f:translate key="license-all-licenses.otp.modal.title" extensionName="ns_license" /></label>
                <div class="ns-all-licenses-otp-boxes" data-all-licenses-otp-boxes>
                    <input type="text" class="form-control text-center" id="all-licenses-otp-digit-0" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="1" data-all-licenses-otp-digit="0" placeholder="-" />
                    <input type="text" class="form-control text-center" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="2" data-all-licenses-otp-digit="1" placeholder="-" />
                    <input type="text" class="form-control text-center" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="3" data-all-licenses-otp-digit="2" placeholder="-" />
                    <input type="text" class="form-control text-center" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="4" data-all-licenses-otp-digit="3" placeholder="-" />
                    <input type="text" class="form-control text-center" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="5" data-all-licenses-otp-digit="4" placeholder="-" />
                    <input type="text" class="form-control text-center" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="6" data-all-licenses-otp-digit="5" placeholder="-" />
                </div>
            </div>
            <div class="t3js-modal-footer modal-footer">
                <button type="button" class="btn btn-default" data-all-licenses-resend-otp>
                    <f:translate key="license-all-licenses.button.resend" extensionName="ns_license" />
                </button>
                <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-1" data-all-licenses-verify-otp>
                    <span data-all-licenses-verify-label><f:translate key="license-all-licenses.button.verify" extensionName="ns_license" /></span>
                    <span class="d-none" data-all-licenses-verify-loading><f:translate key="license-all-licenses.button.verifying" extensionName="ns_license" /></span>
                </button>
            </div>
        </div>
    </div>
</div>
</html>
