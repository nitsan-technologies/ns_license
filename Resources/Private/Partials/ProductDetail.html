<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div id="product-detail-view"
     class="ns-product-detail d-none"
     hidden
     aria-hidden="true"
     data-label-back="{f:translate(key: 'license-catalog.detail.back', extensionName: 'ns_license')}"
     data-label-shop="{f:translate(key: 'license-tabs.shop', extensionName: 'ns_license')}"
     data-label-buy="{f:translate(key: 'license-catalog.detail.buy-now', extensionName: 'ns_license')}"
     data-label-trial="{f:translate(key: 'license-shop.free-trial', extensionName: 'ns_license')}"
     data-label-demo="{f:translate(key: 'license-shop.live-demo', extensionName: 'ns_license')}"
     data-label-docs="{f:translate(key: 'license-catalog.detail.resource.docs', extensionName: 'ns_license')}"
     data-label-product-page="{f:translate(key: 'license-catalog.detail.resource.product', extensionName: 'ns_license')}"
     data-label-copied="{f:translate(key: 'license-catalog.detail.composer.copied', extensionName: 'ns_license')}"
     data-label-latest="{f:translate(key: 'license-catalog.detail.changelog.latest', extensionName: 'ns_license')}"
     data-label-author="{f:translate(key: 'license-catalog.detail.meta.author', extensionName: 'ns_license')}"
     data-label-company="{f:translate(key: 'license-catalog.detail.meta.company', extensionName: 'ns_license')}"
     data-label-last-update="{f:translate(key: 'license-catalog.detail.meta.last-update', extensionName: 'ns_license')}"
     data-label-first-upload="{f:translate(key: 'license-catalog.detail.meta.first-upload', extensionName: 'ns_license')}"
     data-label-downloads="{f:translate(key: 'license-catalog.detail.meta.downloads', extensionName: 'ns_license')}"
     data-label-category="{f:translate(key: 'license-catalog.detail.meta.category', extensionName: 'ns_license')}"
     data-label-extension-key="{f:translate(key: 'license-catalog.detail.meta.extension-key', extensionName: 'ns_license')}"
     data-label-version="{f:translate(key: 'license-catalog.detail.meta.version', extensionName: 'ns_license')}">

    <nav class="ns-product-detail__breadcrumb" aria-label="Breadcrumb">
        <button type="button" class="btn btn-link p-0 ns-product-detail__back t3js-product-detail-back">
            <core:icon identifier="actions-view-go-back" size="small" />
            <span><f:translate key="license-catalog.detail.back" extensionName="ns_license" /></span>
        </button>
        <span class="ns-product-detail__crumb-sep" aria-hidden="true">/</span>
        <span class="js-product-detail-crumb-shop text-variant"></span>
        <span class="ns-product-detail__crumb-sep js-product-detail-crumb-section-sep d-none" aria-hidden="true">/</span>
        <span class="js-product-detail-crumb-section text-variant"></span>
        <span class="ns-product-detail__crumb-sep" aria-hidden="true">/</span>
        <span class="js-product-detail-crumb-name fw-semibold"></span>
    </nav>

    <header class="ns-product-detail__hero js-product-detail-hero">
        <div class="ns-product-detail__hero-bg js-product-detail-hero-bg" aria-hidden="true"></div>
        <div class="ns-product-detail__hero-overlay"></div>
        <div class="ns-product-detail__hero-content">
            <div class="ns-product-detail__badges js-product-detail-badges"></div>
            <h1 class="ns-product-detail__title js-product-detail-title"></h1>
            <p class="ns-product-detail__subtitle js-product-detail-subtitle mb-0"></p>
        </div>
        <div class="ns-product-detail__hero-meta">
            <div class="ns-product-detail__hero-stats js-product-detail-hero-stats"></div>
        </div>
    </header>

    <div class="ns-product-detail__layout">
        <div class="ns-product-detail__main">
            <section class="ns-product-detail__section js-product-detail-overview-section">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.overview" extensionName="ns_license" /></h2>
                <div class="js-product-detail-long-description"></div>
            </section>

            <section class="ns-product-detail__section js-product-detail-keywords-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.tags" extensionName="ns_license" /></h2>
                <div class="ns-product-detail__keywords js-product-detail-keywords"></div>
            </section>

            <section class="ns-product-detail__section js-product-detail-features-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.features" extensionName="ns_license" /></h2>
                <div class="ns-product-detail__features js-product-detail-features"></div>
            </section>

            <section class="ns-product-detail__section js-product-detail-changelog-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.changelog" extensionName="ns_license" /></h2>
                <div class="accordion ns-product-detail__accordion js-product-detail-changelog" id="product-detail-changelog"></div>
            </section>

            <section class="ns-product-detail__section js-product-detail-faq-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.faq" extensionName="ns_license" /></h2>
                <div class="accordion ns-product-detail__accordion js-product-detail-faq" id="product-detail-faq"></div>
            </section>
        </div>

        <aside class="ns-product-detail__sidebar">
            <div class="ns-product-detail__card js-product-detail-cta-card">
                <h3 class="ns-product-detail__card-title"><f:translate key="license-catalog.detail.get-started" extensionName="ns_license" /></h3>
                <div class="ns-product-detail__cta-actions js-product-detail-actions d-flex flex-column gap-2"></div>
            </div>

            <div class="ns-product-detail__card js-product-detail-composer-section d-none">
                <h3 class="ns-product-detail__card-title"><f:translate key="license-catalog.detail.composer" extensionName="ns_license" /></h3>
                <div class="ns-product-detail__composer">
                    <code class="js-product-detail-composer"></code>
                    <button type="button"
                            class="btn btn-default btn-sm t3js-product-detail-copy-composer"
                            title="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}"
                            aria-label="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}">
                        <core:icon identifier="actions-edit-copy" size="small" />
                    </button>
                </div>
            </div>

            <div class="ns-product-detail__card js-product-detail-resources-section d-none">
                <h3 class="ns-product-detail__card-title"><f:translate key="license-catalog.detail.resources" extensionName="ns_license" /></h3>
                <ul class="ns-product-detail__resources list-unstyled mb-0 js-product-detail-resources"></ul>
            </div>

            <div class="ns-product-detail__card">
                <h3 class="ns-product-detail__card-title"><f:translate key="license-catalog.detail.meta" extensionName="ns_license" /></h3>
                <dl class="ns-product-detail__meta mb-0 js-product-detail-meta"></dl>
            </div>

            <div class="ns-product-detail__card js-product-detail-dependencies-section d-none">
                <h3 class="ns-product-detail__card-title"><f:translate key="license-catalog.detail.dependencies" extensionName="ns_license" /></h3>
                <ul class="ns-product-detail__dependencies list-unstyled mb-0 js-product-detail-dependencies"></ul>
            </div>
        </aside>
    </div>
</div>
</html>
