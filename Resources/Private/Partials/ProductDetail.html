<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div id="product-detail-view"
     class="ns-product-detail d-none"
     hidden
     aria-hidden="true"
     data-label-back="{f:translate(key: 'license-catalog.detail.back', extensionName: 'ns_license')}"
     data-label-buy="{f:translate(key: 'license-catalog.detail.buy-now', extensionName: 'ns_license')}"
     data-label-trial="{f:translate(key: 'license-shop.free-trial', extensionName: 'ns_license')}"
     data-label-demo="{f:translate(key: 'license-shop.live-demo', extensionName: 'ns_license')}"
     data-label-demo-frontend="{f:translate(key: 'license-catalog.detail.demo.frontend', extensionName: 'ns_license')}"
     data-label-demo-backend="{f:translate(key: 'license-catalog.detail.demo.backend', extensionName: 'ns_license')}"
     data-label-know-more="{f:translate(key: 'license-shop.know-more', extensionName: 'ns_license')}"
     data-label-nav-overview="{f:translate(key: 'license-catalog.detail.overview', extensionName: 'ns_license')}"
     data-label-nav-features="{f:translate(key: 'license-catalog.detail.features', extensionName: 'ns_license')}"
     data-label-nav-reviews="{f:translate(key: 'license-catalog.detail.reviews', extensionName: 'ns_license')}"
     data-label-nav-references="{f:translate(key: 'license-catalog.detail.references', extensionName: 'ns_license')}"
     data-label-nav-faq="{f:translate(key: 'license-catalog.detail.faq', extensionName: 'ns_license')}"
     data-label-docs="{f:translate(key: 'license-catalog.detail.resource.docs', extensionName: 'ns_license')}"
     data-label-report-issue="{f:translate(key: 'license-catalog.detail.resource.report-issue', extensionName: 'ns_license')}"
     data-label-product-page="{f:translate(key: 'license-catalog.detail.resource.product', extensionName: 'ns_license')}"
     data-label-schedule-call="{f:translate(key: 'license-catalog.detail.resource.schedule', extensionName: 'ns_license')}"
     data-schedule-call-url="https://t3planet.de/kontakt"
     data-report-issue-url-en="https://t3planet.de/en/contact"
     data-report-issue-url-de="https://t3planet.de/kontakt"
     data-label-copied="{f:translate(key: 'license-catalog.detail.composer.copied', extensionName: 'ns_license')}"
     data-label-latest="{f:translate(key: 'license-catalog.detail.changelog.latest', extensionName: 'ns_license')}"
     data-label-author="{f:translate(key: 'license-catalog.detail.meta.author', extensionName: 'ns_license')}"
     data-label-company="{f:translate(key: 'license-catalog.detail.meta.company', extensionName: 'ns_license')}"
     data-label-last-update="{f:translate(key: 'license-catalog.detail.meta.last-update', extensionName: 'ns_license')}"
     data-label-first-upload="{f:translate(key: 'license-catalog.detail.meta.first-upload', extensionName: 'ns_license')}"
     data-label-downloads="{f:translate(key: 'license-catalog.detail.meta.downloads', extensionName: 'ns_license')}"
     data-label-category="{f:translate(key: 'license-catalog.detail.meta.category', extensionName: 'ns_license')}"
     data-label-extension-key="{f:translate(key: 'license-catalog.detail.meta.extension-key', extensionName: 'ns_license')}"
     data-label-version="{f:translate(key: 'license-catalog.detail.meta.version', extensionName: 'ns_license')}">

    <nav class="ns-product-detail__breadcrumb" aria-label="Breadcrumb">
        <button type="button" class="btn btn-link p-0 ns-product-detail__back t3js-product-detail-back">
            <core:icon identifier="actions-view-go-back" size="small" />
            <span><f:translate key="license-catalog.detail.back" extensionName="ns_license" /></span>
        </button>
        <span class="ns-product-detail__crumb-sep js-product-detail-crumb-section-sep d-none" aria-hidden="true">/</span>
        <button type="button"
                class="btn btn-link p-0 ns-product-detail__crumb-link js-product-detail-crumb-section t3js-product-detail-crumb d-none"
                data-crumb-target="section"
                data-catalog-tab=""></button>
        <span class="ns-product-detail__crumb-sep" aria-hidden="true">/</span>
        <span class="js-product-detail-crumb-name ns-product-detail__crumb-current" aria-current="page"></span>
    </nav>

    <div class="ns-product-detail__banner">
        <header class="ns-product-detail__hero js-product-detail-hero card">
            <div class="ns-product-detail__hero-bg js-product-detail-hero-bg" aria-hidden="true"></div>
            <div class="ns-product-detail__hero-overlay" aria-hidden="true"></div>
            <div class="ns-product-detail__hero-inner card-body">
                <div class="row align-items-center g-3">
                    <div class="col-md-6 col-lg-7 js-product-detail-hero-text-col">
                        <div class="ns-product-detail__hero-content">
                            <div class="ns-product-detail__hero-topline">
                                <img class="ns-product-detail__hero-icon js-product-detail-hero-icon d-none" alt="" width="40" height="40" />
                                <div class="ns-product-detail__badges js-product-detail-badges"></div>
                            </div>
                            <h1 class="ns-product-detail__title js-product-detail-title"></h1>
                            <p class="ns-product-detail__hero-desc js-product-detail-hero-desc d-none mb-0"></p>
                            <div class="ns-product-detail__identity">
                                <p class="ns-product-detail__subtitle js-product-detail-subtitle mb-0"></p>
                                <span class="ns-product-detail__product-version js-product-detail-product-version d-none"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-5 js-product-detail-hero-visual-col">
                        <div class="ns-product-detail__hero-visual js-product-detail-hero-visual-wrap d-none">
                            <img class="ns-product-detail__hero-visual-img js-product-detail-hero-visual" alt="" />
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="ns-product-detail__meta-bar card">
            <div class="card-body py-2 px-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                <nav class="ns-product-detail__toc js-product-detail-external-nav" aria-label="Product links">
                    <a class="btn btn-link btn-sm px-0 js-product-detail-ext-link d-none" data-ext-key="features" target="_blank" rel="noopener noreferrer"><f:translate key="license-catalog.detail.features" extensionName="ns_license" /></a>
                    <a class="btn btn-link btn-sm px-0 js-product-detail-ext-link d-none" data-ext-key="reviews" target="_blank" rel="noopener noreferrer"><f:translate key="license-catalog.detail.reviews" extensionName="ns_license" /></a>
                    <a class="btn btn-link btn-sm px-0 js-product-detail-ext-link d-none" data-ext-key="references" target="_blank" rel="noopener noreferrer"><f:translate key="license-catalog.detail.references" extensionName="ns_license" /></a>
                </nav>
                <div class="ns-product-detail__hero-stats js-product-detail-hero-stats"></div>
            </div>
        </div>
    </div>

    <div class="row g-3 ns-product-detail__layout">
        <div class="col-lg-9 ns-product-detail__main">
            <section id="pd-overview" class="ns-product-detail__block js-product-detail-overview-section">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.overview" extensionName="ns_license" /></h2>
                <div class="card ns-product-detail__section">
                    <div class="card-body">
                        <div class="js-product-detail-long-description"></div>
                    </div>
                </div>
            </section>

            <section class="ns-product-detail__block js-product-detail-version-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.version-support" extensionName="ns_license" /></h2>
                <div class="card ns-product-detail__section">
                    <div class="card-body">
                        <div class="ns-product-detail__version-box">
                            <p class="ns-product-detail__version-label mb-2"><f:translate key="license-catalog.detail.version-support.label" extensionName="ns_license" /></p>
                            <div class="ns-product-detail__version-pills js-product-detail-version-pills" role="list"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="pd-features" class="ns-product-detail__block js-product-detail-features-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.features" extensionName="ns_license" /></h2>
                <div class="card ns-product-detail__section">
                    <div class="card-body">
                        <div class="ns-product-detail__features js-product-detail-features"></div>
                    </div>
                </div>
            </section>

            <section class="ns-product-detail__block js-product-detail-related-section d-none"
                     data-label-view="{f:translate(key: 'license-catalog.detail.related.view', extensionName: 'ns_license')}">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.related" extensionName="ns_license" /></h2>
                <div class="ns-product-detail__related js-product-detail-related" role="list"></div>
            </section>

            <section class="ns-product-detail__block js-product-detail-keywords-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.tags" extensionName="ns_license" /></h2>
                <div class="card ns-product-detail__section">
                    <div class="card-body">
                        <div class="ns-product-detail__keywords js-product-detail-keywords"></div>
                    </div>
                </div>
            </section>

            <section class="ns-product-detail__block js-product-detail-security-section"
                     data-static-checksum="a3f2c8d9e14b7063f2a1c5d8e9b0f3a7c2d4e6b8f0a1c3d5e7b9f2a4c6d8e0b3"
                     data-label-copied="{f:translate(key: 'license-catalog.detail.security.copied', extensionName: 'ns_license')}">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.security" extensionName="ns_license" /></h2>
                <div class="card ns-product-detail__section">
                    <div class="card-body">
                        <div class="ns-product-detail__security">
                            <div class="ns-product-detail__security-block">
                                <p class="ns-product-detail__security-label"><f:translate key="license-catalog.detail.security.checksum-label" extensionName="ns_license" /></p>
                                <div class="ns-product-detail__checksum">
                                    <code class="js-product-detail-checksum">a3f2c8d9e14b7063f2a1c5d8e9b0f3a7c2d4e6b8f0a1c3d5e7b9f2a4c6d8e0b3</code>
                                    <button type="button"
                                            class="btn btn-default btn-sm t3js-product-detail-copy-checksum"
                                            title="{f:translate(key: 'license-catalog.detail.security.copy', extensionName: 'ns_license')}"
                                            aria-label="{f:translate(key: 'license-catalog.detail.security.copy', extensionName: 'ns_license')}">
                                        <core:icon identifier="actions-edit-copy" size="small" />
                                    </button>
                                </div>
                                <p class="ns-product-detail__security-hint text-variant mb-0"><f:translate key="license-catalog.detail.security.checksum-hint" extensionName="ns_license" /></p>
                            </div>

                            <div class="ns-product-detail__pgp alert alert-success mb-0" role="note">
                                <div class="ns-product-detail__pgp-body">
                                    <p class="ns-product-detail__pgp-title mb-0"><f:translate key="license-catalog.detail.security.pgp-title" extensionName="ns_license" /></p>
                                    <p class="ns-product-detail__pgp-text text-variant mb-0">
                                        <f:translate key="license-catalog.detail.security.pgp-text" extensionName="ns_license" />
                                        <code>security@t3planet.de</code>.
                                    </p>
                                </div>
                            </div>

                            <div class="panel-group ns-product-detail__panels ns-product-detail__security-verify mb-0" id="product-detail-security-verify">
                                <div class="panel panel-default">
                                    <h3 class="panel-heading" role="tab">
                                        <div class="panel-heading-row">
                                            <button class="panel-button panel-heading-button collapsed"
                                                    type="button"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#pd-security-verify"
                                                    aria-expanded="false"
                                                    aria-controls="pd-security-verify">
                                                <div class="panel-title"><f:translate key="license-catalog.detail.security.verify-title" extensionName="ns_license" /></div>
                                                <span class="caret"></span>
                                            </button>
                                        </div>
                                    </h3>
                                    <div class="panel-collapse collapse" id="pd-security-verify" role="tabpanel">
                                        <div class="panel-body">
                                            <ol class="ns-product-detail__security-steps mb-0">
                                                <li><f:translate key="license-catalog.detail.security.verify-step1" extensionName="ns_license" /></li>
                                                <li>
                                                    <f:translate key="license-catalog.detail.security.verify-step2" extensionName="ns_license" />
                                                    <code class="ns-product-detail__security-cmd">sha256sum &lt;archive.zip&gt;</code>
                                                </li>
                                                <li><f:translate key="license-catalog.detail.security.verify-step3" extensionName="ns_license" /></li>
                                            </ol>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="ns-product-detail__block js-product-detail-changelog-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.changelog" extensionName="ns_license" /></h2>
                <div class="panel-group ns-product-detail__panels js-product-detail-changelog" id="product-detail-changelog"></div>
            </section>

            <section id="pd-faq" class="ns-product-detail__block js-product-detail-faq-section d-none">
                <h2 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.faq" extensionName="ns_license" /></h2>
                <div class="panel-group ns-product-detail__panels js-product-detail-faq" id="product-detail-faq"></div>
            </section>
        </div>

        <aside class="col-lg-3 ns-product-detail__sidebar">
            <div class="ns-product-detail__block js-product-detail-cta-card w-100">
                <h3 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.get-started" extensionName="ns_license" /></h3>
                <div class="card card-size-small ns-product-detail__card w-100">
                    <div class="card-body">
                        <div class="ns-product-detail__cta-actions js-product-detail-actions d-flex flex-column gap-2"></div>
                    </div>
                </div>
            </div>

            <div class="ns-product-detail__block js-product-detail-composer-section d-none w-100">
                <h3 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.composer" extensionName="ns_license" /></h3>
                <div class="card card-size-small ns-product-detail__card w-100">
                    <div class="card-body">
                        <div class="ns-product-detail__composer">
                            <code class="js-product-detail-composer"></code>
                            <button type="button"
                                    class="btn btn-default btn-sm t3js-product-detail-copy-composer"
                                    title="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}"
                                    aria-label="{f:translate(key: 'license-catalog.detail.composer.copy', extensionName: 'ns_license')}">
                                <core:icon identifier="actions-edit-copy" size="small" />
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ns-product-detail__block js-product-detail-resources-section d-none w-100">
                <h3 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.resources" extensionName="ns_license" /></h3>
                <div class="card card-size-small ns-product-detail__card w-100">
                    <div class="card-body">
                        <ul class="ns-product-detail__resources list-unstyled mb-0 js-product-detail-resources"></ul>
                    </div>
                </div>
            </div>

            <div class="ns-product-detail__block w-100">
                <h3 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.meta" extensionName="ns_license" /></h3>
                <div class="card card-size-small ns-product-detail__card w-100">
                    <div class="card-body">
                        <dl class="ns-product-detail__meta mb-0 js-product-detail-meta"></dl>
                    </div>
                </div>
            </div>

            <div class="ns-product-detail__block js-product-detail-dependencies-section w-100">
                <h3 class="ns-product-detail__section-title"><f:translate key="license-catalog.detail.dependencies" extensionName="ns_license" /></h3>
                <ul class="ns-product-detail__dependencies list-unstyled mb-0 js-product-detail-dependencies"></ul>
            </div>
        </aside>
    </div>

    <div class="js-product-detail-icon-templates visually-hidden" aria-hidden="true">
        <span data-icon="changelog-clock"><core:icon identifier="actions-clock" size="small" /></span>
        <span data-icon="stat-download"><core:icon identifier="actions-download" size="small" /></span>
        <span data-icon="cta-cart"><core:icon identifier="actions-cart" size="small" /></span>
        <span data-icon="cta-trial"><core:icon identifier="actions-plus" size="small" /></span>
        <span data-icon="resource-docs"><core:icon identifier="actions-document" size="small" /></span>
        <span data-icon="resource-report"><core:icon identifier="actions-exclamation" size="small" /></span>
        <span data-icon="resource-product"><core:icon identifier="actions-globe" size="small" /></span>
        <span data-icon="resource-schedule"><core:icon identifier="actions-calendar" size="small" /></span>
        <span data-icon="resource-external"><core:icon identifier="actions-window-open" size="small" /></span>
        <span data-icon="feature-check"><core:icon identifier="actions-check" size="small" /></span>
    </div>
</div>
</html>
