<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="search-section d-flex flex-nowrap align-items-center gap-2 mb-3">
    <div class="input-group flex-grow-1">
        <label class="visually-hidden" for="shopSearch"><f:translate key="license-shop.all-sections" extensionName="ns_license" /></label>
        <input type="search" id="shopSearch" class="form-control search-input" placeholder="Search T3Planet Shop...">
    </div>
    <select id="shopSectionFilter" class="form-select w-auto flex-shrink-0">
        <option value="All Sections" selected><f:translate key="license-shop.all-sections" extensionName="ns_license" /></option>
        <f:for each="{shopData.sections}" as="section">
            <option value="{section.title}">{section.title}</option>
        </f:for>
    </select>
    <button type="button" class="btn btn-primary refresh-data-button flex-shrink-0" data-type="shop">
        <core:icon identifier="actions-refresh" size="small" />
        <f:translate key="license-extensions.get-updates" />
    </button>
</div>

<f:if condition="{shopData.sections}">
    <div class="ns-license-shop-sections">
        <f:for each="{shopData.sections}" as="section">
            <div id="{section.id}-wrapper" class="extension-section mb-4">
                                <div class="extension-section-header mb-2">
                    <div class="extension-section__header">
                        <div class="extension-section__header-icon d-flex justify-content-center align-items-center">
                            <f:if condition="{section.id} == 'ai-universe'">
                                <f:then>
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" aria-hidden="true"><g fill="currentColor"><path d="m14.718 3.404-2.122-2.122a.5.5 0 0 0-.707 0L1.282 11.89a.5.5 0 0 0 0 .707l2.122 2.122a.5.5 0 0 0 .707 0L14.718 4.11a.5.5 0 0 0 0-.707ZM3.758 13.657l-1.415-1.414 6.718-6.718 1.414 1.414-6.718 6.718Zm6.01-8.839 2.475-2.475 1.414 1.414-2.475 2.475-1.414-1.414ZM6.75 2H6v-.75A.25.25 0 0 0 5.75 1h-.5a.25.25 0 0 0-.25.25V2h-.75a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25H5v.75c0 .138.112.25.25.25h.5A.25.25 0 0 0 6 3.75V3h.75A.25.25 0 0 0 7 2.75v-.5A.25.25 0 0 0 6.75 2ZM14.75 12H13v-1.75a.25.25 0 0 0-.25-.25h-.5a.25.25 0 0 0-.25.25V12h-1.75a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25H12v1.75c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25V13h1.75a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25Z"/></g></svg>
                                </f:then>
                                <f:else>
                                    <f:if condition="{section.id} == 'premium-templates'">
                                        <f:then>
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" aria-hidden="true"><g><path fill="#FFF" d="M1 1h14v14H1z"/><path fill="#999" d="M14 2v12H2V2h12m1-1H1v14h14V1z"/><path fill="#666" d="M3 3h10v3H3zM3 7h3v6H3z"/><path fill="#B9B9B9" d="M7 7h6v6H7z"/></g></svg>
                                        </f:then>
                                        <f:else>
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" aria-hidden="true"><g fill="currentColor"><path d="M13.408 3.546 7.913 1.087a1.002 1.002 0 0 0-.817 0L1.592 3.545c-.36.161-.592.519-.592.914v7.102a1 1 0 0 0 .594.914l5.496 2.439a1.003 1.003 0 0 0 .812 0l5.504-2.446a1 1 0 0 0 .594-.914V4.459a1 1 0 0 0-.592-.913zM7.504 2l4.89 2.187L7.5 6.449 2.607 4.188 7.504 2zM2 5.01l5 2.31v6.46l-5-2.219V5.01zm6 8.766V7.32l5-2.31v6.545l-5 2.221z"/></g></svg>
                                        </f:else>
                                    </f:if>
                                </f:else>
                            </f:if>
                        </div>
                        <div class="extension-section__header-content">
                            <div class="extension-section__header-title">{section.title}</div>
                        </div>
                    </div>
                    <f:if condition="{section.id} == 'ai-universe'">
                        <f:then>
                            <button type="button"
                                class="btn btn-primary btn-sm t3js-shop-show-section flex-shrink-0"
                                data-section="{section.title}">
                                <f:translate key="license-shop.all-extensions" extensionName="ns_license" />
                            </button>
                        </f:then>
                        <f:else>
                            <f:if condition="{section.id} == 'premium-templates'">
                                <f:then>
                                    <button type="button"
                                        class="btn btn-primary btn-sm t3js-shop-show-section flex-shrink-0"
                                        data-section="{section.title}">
                                        <f:translate key="license-shop.all-templates" extensionName="ns_license" />
                                    </button>
                                </f:then>
                                <f:else if="{section.id} == 'premium-extensions' || {section.id} == 'popular-extensions'">
                                    <button type="button"
                                        class="btn btn-primary btn-sm t3js-shop-show-section flex-shrink-0"
                                        data-section="{section.title}">
                                        <f:translate key="license-shop.all-extensions" extensionName="ns_license" />
                                    </button>
                                </f:else>
                            </f:if>
                        </f:else>
                    </f:if>
                </div>
                <div class="card-container">
                    <f:for each="{section.items}" as="item">
                        <div class="card card-size-small extension-card-wrapper {section.id}-shop-card" data-name="{item.name}" data-section="{section.title}" data-description="{item.description}">
                            <div class="card-header">
                                <div class="card-header-body">
                                    <h2 class="card-title text-truncate mb-0">{item.name}</h2>
                                    <f:if condition="{item.extensionKey}">
                                        <span class="card-subtitle">{item.extensionKey}</span>
                                    </f:if>
                                </div>
                            </div>
                            <div class="card-body">
                                <p class="card-text mb-0">{item.description}</p>
                            </div>
                            <div class="card-footer">
                                <div class="meta-info mb-2">
                                    <f:if condition="{item.rating}">
                                        <div class="meta-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                                            <span>{item.rating}</span>
                                        </div>
                                    </f:if>
                                    <f:if condition="{item.downloads}">
                                        <div class="meta-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg>
                                            <span>{item.downloads}</span>
                                        </div>
                                    </f:if>
                                </div>
                                <div class="actions-wrapper d-flex flex-wrap gap-2">
                                    <f:if condition="{section.id} == 'free-extensions' || {section.id} == 'free-templates'">
                                        <f:then>
                                            <f:if condition="{item.knowMoreUrl}">
                                                <a href="{item.knowMoreUrl}" class="btn btn-link" target="_blank" rel="noopener noreferrer">
                                                    <span><f:translate key="license-shop.know-more" extensionName="ns_license" /></span>
                                                    <core:icon identifier="actions-window-open" size="small" />
                                                </a>
                                            </f:if>
                                        </f:then>
                                        <f:else>
                                            <f:if condition="{item.extensionKey}">
                                                <button type="button"
                                                    class="btn btn-primary btn-sm t3js-get-license-trigger"
                                                    data-extension-key="{item.extensionKey}"
                                                    data-gl-mode="trial">
                                                    <core:icon identifier="actions-plus" size="small" />
                                                    <span><f:translate key="license-shop.free-trial" extensionName="ns_license" /></span>
                                                </button>
                                            </f:if>
                                        </f:else>
                                    </f:if>
                                    <f:if condition="{item.liveDemoUrl}">
                                        <a href="{item.liveDemoUrl}" class="btn btn-default btn-sm" target="_blank" rel="noopener noreferrer">
                                            <core:icon identifier="actions-preview" size="small" />
                                            <span><f:translate key="license-shop.live-demo" extensionName="ns_license" /></span>
                                        </a>
                                    </f:if>
                                </div>
                            </div>
                        </div>
                    </f:for>
                </div>
            </div>
        </f:for>
    </div>
</f:if>
</html>
