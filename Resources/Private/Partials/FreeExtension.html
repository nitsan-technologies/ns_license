<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{extensions}">
<div id="free-section" class="extension-section">
    <div class="catalog-list-heading d-flex align-items-center gap-2 mb-3">
        <h3 class="h5 mb-0">
            <f:translate key="license-extensions.section-title-free" extensionName="ns_license" />
            ({f:count(subject: extensions)})
        </h3>
        <span class="small text-variant"><f:translate key="license-extensions.section-subtitle-free" extensionName="ns_license" /></span>
    </div>
    <div class="row g-3 license-activation">
        <f:for each="{extensions}" as="extension">
            <div class="col-md-6 col-xl-4 extension-card-wrapper extension-free" data-name="{extension.title}" data-key="{extension.key}" data-status="free">
                <div class="card card-size-small h-100 w-100">
                    <div class="card-header">
                        <div class="card-icon">
                            <f:if condition="{extension.icon}">
                                <f:then><img src="{extension.icon}" alt="{extension.title}" width="32" height="32" /></f:then>
                                <f:else><core:icon identifier="actions-brand-typo3" size="medium" alternativeMarkupIdentifier="inline" /></f:else>
                            </f:if>
                        </div>
                        <div class="card-header-body">
                            <div class="d-flex align-items-center justify-content-between gap-2">
                                <h2 class="card-title text-truncate mb-0">{extension.title}</h2>
                                <span class="badge badge-success flex-shrink-0"><f:translate key="license-activation.badge.free" extensionName="ns_license" /></span>
                            </div>
                            <span class="card-subtitle">{extension.key}<f:if condition="{extension.version}"> · v{extension.version}</f:if></span>
                        </div>
                    </div>
                    <div class="card-body">
                        <f:if condition="{extension.description}">
                            <p class="card-text">{extension.description}</p>
                        </f:if>
                    </div>
                    <div class="card-footer">
                        <div class="meta-info mb-2">
                            <f:if condition="{extension.rating}">
                                <div class="meta-item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                                    <span>{extension.rating}</span>
                                </div>
                            </f:if>
                            <f:if condition="{extension.downloads}">
                                <div class="meta-item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg>
                                    <span>{extension.downloads}</span>
                                </div>
                            </f:if>
                            <f:if condition="{extension.details.documentation_link}">
                                <div class="meta-item">
                                    <a href="{extension.details.documentation_link}" target="_blank" rel="noopener noreferrer">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
                                        <span><f:translate key="license-documentation" /></span>
                                    </a>
                                </div>
                            </f:if>
                        </div>
                        <div class="actions-wrapper d-flex flex-wrap gap-2">
                            <f:if condition="{extension.knowMoreUrl}">
                                <a href="{extension.knowMoreUrl}" class="btn btn-default btn-sm" target="_blank" rel="noopener noreferrer">
                                    <core:icon identifier="actions-window-open" size="small" />
                                    <span><f:translate key="license-catalog.detail" extensionName="ns_license" /></span>
                                </a>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
        </f:for>
    </div>
</div>
</f:if>
</html>
