<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{extensions}">
<div id="free-section" class="extension-section mt-4">
    <div class="catalog-list-heading d-flex align-items-center gap-2 mb-3">
        <h3 class="h5 mb-0">
            <f:translate key="license-extensions.section-title-free" extensionName="ns_license" />
            ({f:count(subject: extensions)})
        </h3>
        <span class="small text-variant"><f:translate key="license-extensions.section-subtitle-free" extensionName="ns_license" /></span>
    </div>
    <div class="row g-3 license-activation">
        <f:for each="{extensions}" as="extension">
            <div class="col-md-6 col-lg-4 col-xl-3 extension-card-wrapper extension-free" data-name="{extension.title}" data-key="{extension.key}" data-status="free">
                <div class="card card-size-small h-100 w-100 extension-free-card">
                    <div class="card-header">
                        <div class="extension-free-card__topline d-flex align-items-start justify-content-between gap-2 mb-2">
                            <div class="extension-free-card__icon mb-2" aria-hidden="true">
                                <f:if condition="{extension.icon}">
                                    <f:then><img src="{extension.icon}" alt="" width="40" height="40" /></f:then>
                                    <f:else><core:icon identifier="actions-brand-typo3" size="medium" alternativeMarkupIdentifier="inline" /></f:else>
                                </f:if>
                            </div>
                            <span class="badge badge-success flex-shrink-0"><f:translate key="license-activation.badge.free" extensionName="ns_license" /></span>
                        </div>
                        <div class="card-header-body">
                            <h2 class="card-title mb-1">{extension.title}</h2>
                            <span class="card-subtitle">
                                {extension.key}<f:if condition="{extension.version}"> · {extension.version}</f:if>
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <f:if condition="{extension.description}">
                            <p class="card-text text-variant mb-0">{extension.description}</p>
                        </f:if>
                    </div>
                    <div class="card-footer">
                        <f:if condition="{extension.rating} || {extension.downloads}">
                            <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-2">
                                <div class="meta-info mb-0">
                                    <f:if condition="{extension.rating}">
                                        <div class="meta-item">
                                            <core:icon identifier="actions-star" size="small" />
                                            <span>{extension.rating}</span>
                                        </div>
                                    </f:if>
                                    <f:if condition="{extension.downloads}">
                                        <div class="meta-item">
                                            <core:icon identifier="actions-download" size="small" />
                                            <span>{extension.downloads}</span>
                                        </div>
                                    </f:if>
                                </div>
                            </div>
                        </f:if>
                        <div class="actions-wrapper d-flex flex-wrap justify-content-between gap-2 mb-0">
                            <div class="actions-wrapper-inner d-flex flex-wrap gap-2">
                                <f:if condition="{extension.key}">
                                    <button type="button" class="btn btn-primary btn-sm t3js-get-license-trigger"
                                        data-extension-key="{extension.key}" data-gl-mode="trial">
                                        <core:icon identifier="actions-plus" size="small" />
                                        <span><f:translate key="license-shop.free-trial" extensionName="ns_license" /></span>
                                    </button>
                                </f:if>
                                <f:if condition="{extension.knowMoreUrl}">
                                    <a href="{extension.knowMoreUrl}" class="btn btn-default btn-sm" target="_blank" rel="noopener noreferrer">
                                        <span><f:translate key="license-shop.know-more" extensionName="ns_license" /></span>
                                        <core:icon identifier="actions-window-open" size="small" />
                                    </a>
                                </f:if>
                            </div>
                            <f:if condition="{extension.key}">
                                <button type="button" class="btn btn-default btn-sm t3js-product-detail-trigger"
                                    data-extension-key="{extension.key}">
                                    <core:icon identifier="actions-document-view" size="small" />
                                    <span><f:translate key="license-catalog.detail" extensionName="ns_license" /></span>
                                </button>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
        </f:for>
    </div>
</div>
</f:if>
</html>
