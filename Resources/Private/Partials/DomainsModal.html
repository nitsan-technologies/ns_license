<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div id="domains-modal" class="t3js-modal modal fade modal-type-default modal-severity-default modal-style-default ns-license-modal modal-size-large position-fixed top-50 start-50 translate-middle right-0 left-0 p-0 border-0" tabindex="-1" data-bs-keyboard="true"
    data-auth-logs-no-matching="{f:translate(key: 'license-auth-logs.no_matching', extensionName: 'ns_license')}">
    <div class="modal-dialog">
        <div class="t3js-modal-content modal-content">
            <div class="modal-header">
                <h4 class="t3js-modal-title modal-title">
                    <div class="modal-ext-name-content">
                        <h2 class="modal-ext-name mb-0"></h2>
                        <span class="text-variant"><f:translate key="license-domains.modal.title" extensionName="ns_license" /></span>
                    </div>
                </h4>
                <button type="button" class="t3js-modal-close close bg-transparent border-0" data-bs-dismiss="modal" aria-label="Close">
                    <core:icon identifier="actions-close" size="small" />
                </button>
            </div>
            <div class="t3js-modal-body modal-body">
                <ul class="nav nav-pills modal-tabs mb-3 gap-2" id="domainTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active is-active d-inline-flex align-items-center gap-1" id="domains-tab" data-bs-toggle="tab" data-bs-target="#domains-tab-pane" type="button" role="tab" aria-selected="true">
                            <core:icon identifier="apps-pagetree-page-domain" size="small" />
                            <f:translate key="license-domains.tab.domains" extensionName="ns_license" />
                            <span class="badge badge-default" data-badge="0">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link d-inline-flex align-items-center gap-1" id="auth-tab" data-bs-toggle="tab" data-bs-target="#auth-tab-pane" type="button" role="tab" aria-selected="false">
                            <core:icon identifier="actions-info" size="small" />
                            <f:translate key="license-domains.tab.auth_logs" extensionName="ns_license" />
                            <span class="badge badge-danger" data-badge="0">0</span>
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="domainTabsContent">
                    <div class="tab-pane show active" id="domains-tab-pane" role="tabpanel">
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <div class="input-group flex-grow-1">
                                <label class="visually-hidden" for="domains-search-input"><f:translate key="license-domains.search_placeholder" extensionName="ns_license" /></label>
                                <input type="search" id="domains-search-input" class="form-control search-input"
                                    placeholder="{f:translate(key: 'license-domains.search_placeholder', extensionName: 'ns_license')}">
                            </div>
                            <select id="domains-environment-filter" class="form-select w-auto">
                                <option value="all"><f:translate key="license-domains.filter.environment.all" extensionName="ns_license" /></option>
                                <option value="production"><f:translate key="license-domains.filter.environment.production" extensionName="ns_license" /></option>
                                <option value="staging"><f:translate key="license-domains.filter.environment.staging" extensionName="ns_license" /></option>
                                <option value="local"><f:translate key="license-domains.filter.environment.local" extensionName="ns_license" /></option>
                            </select>
                            <button type="button" class="btn btn-success t3js-add-domain-modal-trigger d-inline-flex align-items-center gap-1"
                                    data-add-domain-title="{f:translate(key: 'license-domains.add_modal.title', extensionName: 'ns_license')}"
                                    data-add-domain-cancel="{f:translate(key: 'license-activation.update_extension_btn_cancel', extensionName: 'ns_license')}"
                                    data-add-domain-submit="{f:translate(key: 'license-domains.button.add_domain', extensionName: 'ns_license')}">
                                <core:icon identifier="actions-plus" size="small" />
                                <f:translate key="license-domains.button.add_domain" extensionName="ns_license" />
                            </button>
                        </div>
                        <div class="row g-3 domains-list"></div>
                    </div>

                    <div class="tab-pane" id="auth-tab-pane" role="tabpanel">
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <div class="input-group flex-grow-1">
                                <label class="visually-hidden" for="auth-log-search"><f:translate key="license-auth-logs.search_placeholder" extensionName="ns_license" /></label>
                                <input type="search" id="auth-log-search" class="form-control search-input" placeholder="{f:translate(key: 'license-auth-logs.search_placeholder', extensionName: 'ns_license')}">
                            </div>
                            <select id="auth-log-filter" class="form-select w-auto">
                                <option value="all"><f:translate key="license-auth.filter.type.all" extensionName="ns_license" /></option>
                                <option value="domain_removed"><f:translate key="license-auth.filter.type.domain_removed" extensionName="ns_license" /></option>
                                <option value="domain_added"><f:translate key="license-auth.filter.type.domain_added" extensionName="ns_license" /></option>
                                <option value="domain_limit_reached"><f:translate key="license-auth.filter.type.domain_limit_reached" extensionName="ns_license" /></option>
                                <option value="domain_updated"><f:translate key="license-auth.filter.type.domain_updated" extensionName="ns_license" /></option>
                                <option value="error2"><f:translate key="license-auth.filter.type.error2" extensionName="ns_license" /></option>
                            </select>
                        </div>
                        <div class="d-flex flex-column gap-3 auth-logs-list"></div>
                    </div>
                </div>
            </div>
            <div class="t3js-modal-footer modal-footer">
                <button type="button" class="btn btn-default" data-bs-dismiss="modal">
                    <f:translate key="license-activation.update_extension_btn_cancel" extensionName="ns_license"/>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="add-domain-modal-template" style="display:none" aria-hidden="true">
    <form id="add-domain-form" class="js-add-domain-form">
        <input type="hidden" id="add-domain-ext-key" value="">
        <div class="mb-3">
            <label class="form-label" for="add-domain-input">
                <f:translate key="license-domains.add_modal.field.domain.label" extensionName="ns_license" />
            </label>
            <input type="text" id="add-domain-input" class="form-control" placeholder="{f:translate(key: 'license-domains.add_modal.field.domain.placeholder', extensionName: 'ns_license')}" required>
            <small class="form-text text-variant">
                <f:translate key="license-domains.add_modal.field.domain.help" extensionName="ns_license" />
            </small>
        </div>
        <div class="mb-3">
            <label class="form-label" for="add-domain-environment">
                <f:translate key="license-domains.add_modal.field.environment.label" extensionName="ns_license" />
            </label>
            <select id="add-domain-environment" class="form-select" required>
                <option value="">{f:translate(key: 'license-domains.add_modal.field.environment.placeholder', extensionName: 'ns_license')}</option>
                <option value="production"><f:translate key="license-domains.filter.environment.production" extensionName="ns_license" /></option>
                <option value="staging"><f:translate key="license-domains.filter.environment.staging" extensionName="ns_license" /></option>
                <option value="local"><f:translate key="license-domains.filter.environment.local" extensionName="ns_license" /></option>
            </select>
        </div>
    </form>
</div>

<div id="ns-license-icon-templates" class="visually-hidden" aria-hidden="true">
    <span data-icon="domain"><core:icon identifier="apps-pagetree-page-domain" size="small" /></span>
    <span data-icon="edit"><core:icon identifier="actions-open" size="small" /></span>
    <span data-icon="delete"><core:icon identifier="actions-delete" size="small" /></span>
    <span data-icon="save"><core:icon identifier="actions-check" size="small" /></span>
</div>
</html>
