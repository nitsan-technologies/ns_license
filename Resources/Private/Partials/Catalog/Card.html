<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="isFreeSection" value="0" />
<f:if condition="{item.isFree} || {item.price} == 'Free'">
    <f:variable name="isFreeSection" value="1" />
</f:if>
<div class="col-md-6 col-xl-4 catalog-card extension-card-wrapper"
     data-name="{item.name}"
     data-description="{item.description}"
     data-extension-key="{item.extensionKey}"
     data-is-free="{isFreeSection}">
    <div class="card card-size-small h-100 w-100">
        <div class="card-header">
            <div class="card-header-body">
                <div class="d-flex align-items-center justify-content-between gap-2">
                    <h2 class="card-title text-truncate mb-0">{item.name}</h2>
                    <f:if condition="{item.badge}">
                        <span class="badge badge-primary flex-shrink-0">{item.badge}</span>
                    </f:if>
                </div>
                <f:if condition="{item.extensionKey}">
                    <span class="card-subtitle">{item.extensionKey}<f:if condition="{item.version}"> · v{item.version}</f:if></span>
                </f:if>
            </div>
        </div>
        <div class="card-body">
            <p class="card-text mb-0">{item.description}</p>
        </div>
        <div class="card-footer">
            <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-2">
                <div class="meta-info mb-0">
                    <f:if condition="{item.rating}">
                        <div class="meta-item">
                            <core:icon identifier="actions-star" size="small" />
                            <span>{item.rating}</span>
                        </div>
                    </f:if>
                    <f:if condition="{item.downloads}">
                        <div class="meta-item">
                            <core:icon identifier="actions-download" size="small" />
                            <span>{item.downloads}</span>
                        </div>
                    </f:if>
                </div>
                <f:if condition="{item.price}">
                    <div class="catalog-card-price fw-semibold text-nowrap ms-auto">{item.price}</div>
                </f:if>
            </div>
            <div class="actions-wrapper d-flex flex-wrap gap-2">
                <f:if condition="{isFreeSection}">
                    <f:then>
                        <f:if condition="{item.knowMoreUrl}">
                            <a href="{item.knowMoreUrl}" class="btn btn-link" target="_blank" rel="noopener noreferrer">
                                <span><f:translate key="license-shop.know-more" extensionName="ns_license" /></span>
                                <core:icon identifier="actions-window-open" size="small" />
                            </a>
                        </f:if>
                    </f:then>
                    <f:else>
                        <f:if condition="{item.extensionKey}">
                            <button type="button"
                                class="btn btn-primary btn-sm t3js-get-license-trigger"
                                data-extension-key="{item.extensionKey}"
                                data-gl-mode="trial">
                                <core:icon identifier="actions-plus" size="small" />
                                <span><f:translate key="license-shop.free-trial" extensionName="ns_license" /></span>
                            </button>
                        </f:if>
                    </f:else>
                </f:if>
                <f:if condition="{item.liveDemoUrl}">
                    <a href="{item.liveDemoUrl}" class="btn btn-default btn-sm" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-preview" size="small" />
                        <span><f:translate key="license-shop.live-demo" extensionName="ns_license" /></span>
                    </a>
                </f:if>
                <f:if condition="{item.extensionKey}">
                    <button type="button"
                        class="btn btn-default btn-sm t3js-product-detail-trigger"
                        data-extension-key="{item.extensionKey}">
                        <core:icon identifier="actions-document-view" size="small" />
                        <span><f:translate key="license-catalog.detail" extensionName="ns_license" /></span>
                    </button>
                </f:if>
            </div>
        </div>
    </div>
</div>
</html>
