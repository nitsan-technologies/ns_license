<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="isFreeSection" value="0" />
<f:if condition="{item.isFree} || {item.price} == 'Free'">
    <f:variable name="isFreeSection" value="1" />
</f:if>

<f:variable name="cardVariantClass" value="" />
<f:variable name="isTemplatesTab" value="0" />
<f:if condition="{catalogTab} == 'templates'">
    <f:variable name="cardVariantClass" value="catalog-card--templates" />
    <f:variable name="isTemplatesTab" value="1" />
</f:if>

<f:variable name="placeholderImage" value="{f:uri.resource(path: 'EXT:ns_license/Resources/Public/Icons/catalog-placeholder.svg')}" />
<f:variable name="cardImage" value="{placeholderImage}" />
<f:if condition="{item.listImage}">
    <f:variable name="cardImage" value="{item.listImage}" />
</f:if>

<div class="catalog-card {cardVariantClass} extension-card-wrapper" data-name="{item.name}"
    data-description="{item.description}" data-extension-key="{item.extensionKey}" data-is-free="{isFreeSection}"
    data-rating="{item.rating}" data-downloads="{item.downloads}" data-price="{item.price}"
    data-rating-value="{item.ratingValue}" data-downloads-value="{item.downloadsValue}" data-price-value="{item.priceValue}">
    <div class="card card-size-small h-100">
        <f:if condition="{isTemplatesTab}">
            <div class="catalog-card__image">
                <f:if condition="{item.extensionKey}">
                    <f:then>
                        <button type="button"
                            class="catalog-card__media-btn t3js-product-detail-trigger"
                            data-extension-key="{item.extensionKey}"
                            aria-label="{item.name}">
                            <img class="t3js-catalog-card-image{f:if(condition: item.listImage, else: ' is-placeholder')}"
                                src="{cardImage}"
                                alt="{item.name}"
                                loading="lazy"
                                data-fallback="{placeholderImage}" />
                        </button>
                    </f:then>
                    <f:else>
                        <img class="t3js-catalog-card-image{f:if(condition: item.listImage, else: ' is-placeholder')}"
                            src="{cardImage}"
                            alt="{item.name}"
                            loading="lazy"
                            data-fallback="{placeholderImage}" />
                    </f:else>
                </f:if>
            </div>
        </f:if>
        <div class="card-header">
            <f:if condition="{isTemplatesTab}">
                <f:else>
                    <div class="catalog-card__image d-flex align-items-start justify-content-between mb-3">
                        <f:if condition="{item.extensionKey}">
                            <f:then>
                                <button type="button"
                                    class="catalog-card__media-btn t3js-product-detail-trigger"
                                    data-extension-key="{item.extensionKey}"
                                    aria-label="{item.name}">
                                    <img class="t3js-catalog-card-image{f:if(condition: item.listImage, else: ' is-placeholder')}"
                                        src="{cardImage}"
                                        alt="{item.name}"
                                        loading="lazy"
                                        data-fallback="{placeholderImage}" />
                                </button>
                            </f:then>
                            <f:else>
                                <img class="t3js-catalog-card-image{f:if(condition: item.listImage, else: ' is-placeholder')}"
                                    src="{cardImage}"
                                    alt="{item.name}"
                                    loading="lazy"
                                    data-fallback="{placeholderImage}" />
                            </f:else>
                        </f:if>
                        <f:if condition="{item.version}">
                            <span class="badge badge-default">{item.version}</span>
                        </f:if>
                    </div>
                </f:else>
            </f:if>

            <div class="card-header-body mb-3">
                <div class="d-flex align-items-center justify-content-start gap-2 flex-wrap">
                    <f:if condition="{item.extensionKey}">
                        <f:then>
                            <h2 class="card-title mb-0">
                                <button type="button"
                                    class="catalog-card__title-btn t3js-product-detail-trigger"
                                    data-extension-key="{item.extensionKey}">
                                    {item.name}
                                </button>
                            </h2>
                        </f:then>
                        <f:else>
                            <h2 class="card-title mb-0">{item.name}</h2>
                        </f:else>
                    </f:if>
                    <f:if condition="{item.badge}">
                        <span class="badge badge-primary flex-shrink-0">{item.badge}</span>
                    </f:if>
                </div>
                <f:if condition="{item.extensionKey}">
                    <span class="card-subtitle">{item.extensionKey}</span>
                </f:if>
            </div>
        </div>
        <div class="card-body pt-0">
            <p class="card-text mb-0 text-variant">{item.description}</p>
        </div>
        <div class="card-footer">
            <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-2">
                <div class="meta-info mb-0">
                    <f:if condition="{item.rating}">
                        <div class="meta-item">
                            <core:icon identifier="actions-star" size="small" />
                            <span>{item.rating}</span>
                        </div>
                    </f:if>
                    <f:if condition="{item.downloads}">
                        <div class="meta-item">
                            <core:icon identifier="actions-download" size="small" />
                            <span>{item.downloads}</span>
                        </div>
                    </f:if>
                </div>
                <f:if condition="{item.price}">
                    <div class="catalog-card-price fw-semibold text-nowrap ms-auto">{item.price}</div>
                </f:if>
            </div>
            <div class="actions-wrapper d-flex flex-wrap justify-content-between gap-2">
                <div class="actions-wrapper-inner">
                    <f:if condition="{isFreeSection}">
                        <f:then>
                            <f:if condition="{item.knowMoreUrl}">
                                <a href="{item.knowMoreUrl}" class="btn btn-default btn-sm" target="_blank" rel="noopener noreferrer">
                                    <span>
                                        <f:translate key="license-shop.know-more" extensionName="ns_license" />
                                    </span>
                                    <core:icon identifier="actions-window-open" size="small" />
                                </a>
                            </f:if>
                        </f:then>
                        <f:else>
                            <f:if condition="{item.extensionKey}">
                                <button type="button" class="btn btn-primary btn-sm t3js-get-license-trigger"
                                    data-extension-key="{item.extensionKey}" data-gl-mode="trial">
                                    <core:icon identifier="actions-plus" size="small" />
                                    <span>
                                        <f:translate key="license-shop.free-trial" extensionName="ns_license" />
                                    </span>
                                </button>
                            </f:if>
                        </f:else>
                    </f:if>
                    <f:if condition="{isTemplatesTab}">
                        <f:else>
                            <f:variable name="backendDemoUrl" value="{item.liveDemoUrl}" />
                            <f:if condition="{item.backendDemoUrl}">
                                <f:variable name="backendDemoUrl" value="{item.backendDemoUrl}" />
                            </f:if>
                            <f:if condition="{backendDemoUrl}">
                                <a href="{backendDemoUrl}" class="btn btn-default btn-sm" target="_blank"
                                    rel="noopener noreferrer">
                                    <core:icon identifier="actions-preview" size="small" />
                                    <span>
                                        <f:translate key="license-catalog.detail.demo.backend" extensionName="ns_license" />
                                    </span>
                                </a>
                            </f:if>
                        </f:else>
                    </f:if>
                </div>
                <f:if condition="{item.extensionKey}">
                    <button type="button" class="btn btn-default btn-sm t3js-product-detail-trigger"
                        data-extension-key="{item.extensionKey}">
                        <core:icon identifier="actions-document-view" size="small" />
                        <span>
                            <f:translate key="license-catalog.detail" extensionName="ns_license" />
                        </span>
                    </button>
                </f:if>
            </div>
        </div>
    </div>
</div>

</html>
