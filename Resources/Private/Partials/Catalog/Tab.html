<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="catalog-tab-content" data-catalog-tab="{catalogTab}" data-catalog-view="card">
    <div class="search-section d-flex flex-nowrap align-items-center gap-2 mb-3">
        <div class="input-group flex-grow-1">
            <label class="visually-hidden" for="catalogSearch-{catalogTab}"><f:translate key="license-catalog.search-placeholder" extensionName="ns_license" /></label>
            <input type="search" id="catalogSearch-{catalogTab}" class="form-control search-input catalog-search" placeholder="{f:translate(key: 'license-catalog.search-placeholder', extensionName: 'ns_license')}">
        </div>
        <select id="catalogFilter-{catalogTab}" class="form-select w-auto flex-shrink-0 catalog-filter">
            <option value="all" selected>
                <f:if condition="{catalogTab} == 'templates'">
                    <f:then>
                        <f:translate key="license-catalog.filter-all-templates" extensionName="ns_license" />
                    </f:then>
                    <f:else>
                        <f:translate key="license-catalog.filter-all" extensionName="ns_license" />
                    </f:else>
                </f:if>
            </option>
            <option value="premium"><f:translate key="license-catalog.filter-premium" extensionName="ns_license" /></option>
            <option value="free"><f:translate key="license-catalog.filter-free" extensionName="ns_license" /></option>
        </select>
        <select id="catalogSort-{catalogTab}" class="form-select w-auto flex-shrink-0 catalog-sort" aria-label="{f:translate(key: 'license-catalog.sort.label', extensionName: 'ns_license')}">
            <option value="popular" selected><f:translate key="license-catalog.sort.popular" extensionName="ns_license" /></option>
            <option value="rated"><f:translate key="license-catalog.sort.rated" extensionName="ns_license" /></option>
            <option value="price-asc"><f:translate key="license-catalog.sort.price-asc" extensionName="ns_license" /></option>
            <option value="price-desc"><f:translate key="license-catalog.sort.price-desc" extensionName="ns_license" /></option>
        </select>
        <div class="btn-group catalog-view-toggle flex-shrink-0" role="group" aria-label="{f:translate(key: 'license-catalog.view.label', extensionName: 'ns_license')}">
            <button type="button"
                class="btn btn-default catalog-view-toggle__btn is-active"
                data-catalog-view="card"
                title="{f:translate(key: 'license-catalog.view.card', extensionName: 'ns_license')}"
                aria-label="{f:translate(key: 'license-catalog.view.card', extensionName: 'ns_license')}"
                aria-pressed="true">
                <core:icon identifier="actions-viewmode-tiles" size="small" />
            </button>
            <button type="button"
                class="btn btn-default catalog-view-toggle__btn"
                data-catalog-view="list"
                title="{f:translate(key: 'license-catalog.view.list', extensionName: 'ns_license')}"
                aria-label="{f:translate(key: 'license-catalog.view.list', extensionName: 'ns_license')}"
                aria-pressed="false">
                <core:icon identifier="actions-viewmode-list" size="small" />
            </button>
        </div>
        <button type="button" class="btn btn-primary refresh-data-button flex-shrink-0" data-type="shop">
            <core:icon identifier="actions-refresh" size="small" />
            <f:translate key="license-extensions.get-updates" />
        </button>
    </div>

    <f:if condition="{catalogHeroItem}">
        <f:render partial="Catalog/Hero" arguments="{item: catalogHeroItem, catalogTab: catalogTab}" />
    </f:if>

    <f:if condition="{catalogPremiumItems} || {catalogFreeItems} || {catalogHeroItem}">
        <f:then>
            <f:if condition="{catalogPremiumItems}">
                <div class="catalog-section catalog-section--premium" data-catalog-section="premium">
                    <div class="catalog-list-heading d-flex align-items-center gap-2 mb-3">
                        <h3 class="h4 mb-0 catalog-section-heading">
                            <f:if condition="{catalogTab} == 'templates'">
                                <f:then>
                                    <f:translate key="license-catalog.list-heading.premium-templates" extensionName="ns_license" />
                                </f:then>
                                <f:else if="{catalogTab} == 'ai-universe'">
                                    <f:translate key="license-catalog.list-heading.premium-ai" extensionName="ns_license" />
                                </f:else>
                                <f:else>
                                    <f:translate key="license-catalog.list-heading.premium-extensions" extensionName="ns_license" />
                                </f:else>
                            </f:if>
                            (<span class="catalog-section-count">{f:count(subject: catalogPremiumItems)}</span>)
                        </h3>
                    </div>
                    <div class="card-container catalog-card-container">
                        <f:for each="{catalogPremiumItems}" as="item">
                            <f:render partial="Catalog/Card" arguments="{item: item, catalogTab: catalogTab}" />
                        </f:for>
                    </div>
                </div>
            </f:if>

            <f:if condition="{catalogFreeItems}">
                <div class="catalog-section catalog-section--free mt-4" data-catalog-section="free">
                    <div class="catalog-list-heading d-flex align-items-center gap-2 mb-3">
                        <h3 class="h4 mb-0 catalog-section-heading">
                            <f:if condition="{catalogTab} == 'templates'">
                                <f:then>
                                    <f:translate key="license-catalog.list-heading.free-templates" extensionName="ns_license" />
                                </f:then>
                                <f:else if="{catalogTab} == 'ai-universe'">
                                    <f:translate key="license-catalog.list-heading.free-ai" extensionName="ns_license" />
                                </f:else>
                                <f:else>
                                    <f:translate key="license-catalog.list-heading.free-extensions" extensionName="ns_license" />
                                </f:else>
                            </f:if>
                            (<span class="catalog-section-count">{f:count(subject: catalogFreeItems)}</span>)
                        </h3>
                        <span class="small text-variant"><f:translate key="license-extensions.section-subtitle-free" extensionName="ns_license" /></span>
                    </div>
                    <div class="card-container catalog-card-container">
                        <f:for each="{catalogFreeItems}" as="item">
                            <f:render partial="Catalog/Card" arguments="{item: item, catalogTab: catalogTab}" />
                        </f:for>
                    </div>
                </div>
            </f:if>

            <script type="application/json" class="catalog-items-json" data-catalog-tab="{catalogTab}"><f:format.raw>{catalogItemsJson}</f:format.raw></script>
        </f:then>
        <f:else>
            <p class="text-variant text-center py-5"><f:translate key="license-catalog.empty" extensionName="ns_license" /></p>
        </f:else>
    </f:if>
</div>
</html>
