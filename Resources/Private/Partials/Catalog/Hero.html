<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="isFreeSection" value="0" />
<f:if condition="{item.isFree} || {item.price} == 'Free'">
    <f:variable name="isFreeSection" value="1" />
</f:if>
<article class="catalog-hero mb-4"
         data-name="{item.name}"
         data-description="{item.description}"
         data-extension-key="{item.extensionKey}"
         data-is-free="{isFreeSection}">
    <div class="card card-size-large">
        <div class="card-body">
            <div class="row g-3 align-items-stretch">
                <div class="col-md-6 col-lg-6">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                        <f:if condition="{item.category}">
                            <span class="badge badge-default">{item.category}</span>
                        </f:if>
                        <span class="badge badge-warning">
                            <f:if condition="{catalogTab} == 'templates'">
                                <f:then>
                                    <f:translate key="license-catalog.hero.most-popular-template" extensionName="ns_license" />
                                </f:then>
                                <f:else>
                                    <f:translate key="license-catalog.hero.most-popular" extensionName="ns_license" />
                                </f:else>
                            </f:if>
                        </span>
                    </div>

                    <div class="catalog-hero__identity mb-3">
                        <f:variable name="useT3KarmaWordmark" value="0" />
                        <f:if condition="{catalogTab} == 'templates'">
                            <f:if condition="{item.extensionKey} == 'ns_theme_t3karma'">
                                <f:variable name="useT3KarmaWordmark" value="1" />
                            </f:if>
                        </f:if>

                        <f:if condition="{useT3KarmaWordmark}">
                            <f:then>
                                <div class="catalog-hero__wordmark">
                                    <img class="catalog-hero__wordmark-img"
                                         src="{f:uri.resource(path: 'EXT:ns_license/Resources/Public/Icons/t3karma-wordmark.svg')}"
                                         alt="{item.name}"
                                         width="200"
                                         height="47"
                                         loading="lazy" />
                                </div>
                                <div class="catalog-hero__identity-text">
                                    <h2 class="card-title catalog-hero__title visually-hidden mb-1">{item.name}</h2>
                                    <p class="card-subtitle catalog-hero__meta text-variant mb-0">
                                        {item.extensionKey}<f:if condition="{item.version}"> · v{item.version}</f:if>
                                    </p>
                                </div>
                            </f:then>
                            <f:else>
                                <f:if condition="{item.listImage}">
                                    <div class="catalog-hero__icon" aria-hidden="true">
                                        <img class="catalog-hero__icon-img t3js-catalog-card-image"
                                             src="{item.listImage}"
                                             alt=""
                                             loading="lazy"
                                             data-fallback="{f:uri.resource(path: 'EXT:ns_license/Resources/Public/Icons/catalog-placeholder.svg')}" />
                                    </div>
                                </f:if>
                                <div class="catalog-hero__identity-text">
                                    <h2 class="card-title catalog-hero__title mb-1">{item.name}</h2>
                                    <p class="card-subtitle catalog-hero__meta text-variant mb-0">
                                        {item.extensionKey}<f:if condition="{item.version}"> · v{item.version}</f:if>
                                    </p>
                                </div>
                            </f:else>
                        </f:if>
                    </div>

                    <f:if condition="{item.description}">
                        <p class="card-text mb-3 text-variant">{item.description}</p>
                    </f:if>

                    <f:if condition="{item.rating} || {item.downloads} || {item.price}">
                        <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-3">
                            <div class="meta-info mb-0">
                                <f:if condition="{item.rating}">
                                    <div class="meta-item">
                                        <core:icon identifier="actions-star" size="small" />
                                        <span>{item.rating}</span>
                                    </div>
                                </f:if>
                                <f:if condition="{item.downloads}">
                                    <div class="meta-item">
                                        <core:icon identifier="actions-download" size="small" />
                                        <span>{item.downloads}</span>
                                    </div>
                                </f:if>
                            </div>
                        </div>
                    </f:if>

                    <f:if condition="{item.features}">
                        <ul class="catalog-hero__features list-unstyled mb-3">
                            <f:for each="{item.features}" as="feature" iteration="i">
                                <f:if condition="{i.index} < 5">
                                    <li class="d-flex align-items-start gap-2 mb-1">
                                        <span class="text-success flex-shrink-0" aria-hidden="true">
                                            <core:icon identifier="actions-check" size="small" />
                                        </span>
                                        <span>{feature}</span>
                                    </li>
                                </f:if>
                            </f:for>
                        </ul>
                    </f:if>

                    <div class="d-flex flex-wrap gap-2">
                        <f:if condition="{isFreeSection}">
                            <f:then>
                                <f:if condition="{item.knowMoreUrl}">
                                    <a href="{item.knowMoreUrl}" class="btn btn-default" target="_blank" rel="noopener noreferrer">
                                        <core:icon identifier="actions-window-open" size="small" />
                                        <span><f:translate key="license-shop.know-more" extensionName="ns_license" /></span>
                                    </a>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:if condition="{item.extensionKey}">
                                    <button type="button"
                                        class="btn btn-primary t3js-get-license-trigger"
                                        data-extension-key="{item.extensionKey}"
                                        data-gl-mode="trial">
                                        <core:icon identifier="actions-plus" size="small" />
                                        <span><f:translate key="license-shop.free-trial" extensionName="ns_license" /></span>
                                    </button>
                                    <button type="button"
                                        class="btn btn-default t3js-get-license-trigger"
                                        data-extension-key="{item.extensionKey}"
                                        data-gl-mode="buy">
                                        <core:icon identifier="actions-plus" size="small" />
                                        <span>
                                            <f:if condition="{item.price}">
                                                <f:then>{item.price} <f:translate key="license-catalog.detail.buy-now" extensionName="ns_license" /></f:then>
                                                <f:else><f:translate key="license-catalog.detail.buy-now" extensionName="ns_license" /></f:else>
                                            </f:if>
                                        </span>
                                    </button>
                                </f:if>
                            </f:else>
                        </f:if>
                        <f:if condition="{item.liveDemoUrl}">
                            <a href="{item.liveDemoUrl}" class="btn btn-default" target="_blank" rel="noopener noreferrer">
                                <core:icon identifier="actions-preview" size="small" />
                                <span><f:translate key="license-shop.live-demo" extensionName="ns_license" /></span>
                            </a>
                        </f:if>
                        <f:if condition="{item.extensionKey}">
                            <button type="button"
                                class="btn btn-default t3js-product-detail-trigger"
                                data-extension-key="{item.extensionKey}">
                                <core:icon identifier="actions-document-view" size="small" />
                                <span><f:translate key="license-catalog.detail" extensionName="ns_license" /></span>
                            </button>
                        </f:if>
                    </div>
                </div>

                <div class="col-md-6 col-lg-6">
                    <div class="catalog-hero__media">
                        <f:variable name="heroImage" value="{item.listImage}" />
                        <f:if condition="{item.detailImage}">
                            <f:variable name="heroImage" value="{item.detailImage}" />
                        </f:if>
                        <f:if condition="{heroImage}">
                            <f:then>
                                <img class="catalog-hero__media-img" src="{heroImage}" alt="{item.name}" loading="lazy" />
                            </f:then>
                            <f:else>
                                <div class="catalog-hero__media-fallback" aria-hidden="true">
                                    <core:icon identifier="content-plugin" size="large" />
                                </div>
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>
</html>
