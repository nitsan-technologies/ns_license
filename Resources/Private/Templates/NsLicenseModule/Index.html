<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
     xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
    <f:if condition="{t3version} == 12 || {t3version} == 14">
        <f:be.pageRenderer includeCssFiles="{0:'EXT:ns_license/Resources/Public/css/custom-12.css'}" />
    </f:if>
    <f:be.pageRenderer includeJavaScriptModules="{0:'@nitsan/ns-license/main.js', 1:'@nitsan/ns-license/filter.js',2:'@nitsan/ns-license/domains.js',3:'@nitsan/ns-license/get-license.js',4:'@nitsan/ns-license/product-detail.js',5:'@nitsan/ns-license/all-licenses.js',6:'@nitsan/ns-license/demo-modal.js'}" />

      <div class="ns-license-tab-page-header mb-3">
          <div class="ns-license-tab-page-header__main min-w-0">
              <h1 class="mb-1 ns-license-tab-page-header__title align-items-center">
                  <span class="ns-license-tab-page-header__icon" aria-hidden="true">
                      <f:if condition="{t3version} == 14">
                          <f:then>
                              <core:icon identifier="submodule-nslicense-v14" size="medium" alternativeMarkupIdentifier="inline" />
                          </f:then>
                          <f:else>
                              <core:icon identifier="submodule-nslicense-v12" size="medium" alternativeMarkupIdentifier="inline" />
                          </f:else>
                      </f:if>
                  </span>
                  <span class="ns-license-tab-page-header__brand"><f:translate key="license-tabs.shop.title" extensionName="ns_license" /></span>
                  <span class="ns-license-tab-page-header__sep" aria-hidden="true">|</span>
                  <span class="ns-license-tab-page-header__section"><f:translate key="license-tabs.my-extensions.title" extensionName="ns_license" /></span>
              </h1>
              <p class="text-variant mb-0 ns-license-tab-page-header__subtitle"><f:translate key="license-tabs.my-extensions.description" extensionName="ns_license" /></p>
          </div>
      </div>

      <!-- Tab Content -->
      <div class="tab-content" id="license-tab-content">
        <!-- My Extensions Tab Pane -->
        <div class="tab-pane fade show active" id="extensions-pane" role="tabpanel" aria-labelledby="my-extensions-tab"
             data-no-results-message="{f:translate(key: 'extension.search.no_result')}">
            <!-- My Extensions Section -->
            <div class="row">
                <div class="col-sm-12">
                    <div class="card card-size-large custom-card mb-3">
                        <div class="card-header">
                            <div class="card-header-body">
                                <h2 class="card-title">
                                    <f:translate key="license-activation.btn-activate" extensionName="ns_license" />
                                </h2>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="ns-license-activation-form">
                                <f:form action="activation" class="ns-license-form ns-ext-form">
                                    <div class="form-group d-flex flex-nowrap gap-3 align-items-center">
                                        <f:form.textfield
                                            name="license"
                                            class="form-control"
                                            id="license"
                                            required="required"
                                            placeholder="{f:translate(key: 'license-activation.licensepLaceholder')}"
                                        />
                                        <f:form.button type="submit" name="submit" class="btn btn-primary d-inline-flex align-items-center gap-1 flex-shrink-0">
                                            <core:icon identifier="actions-key" size="small" alternativeMarkupIdentifier="inline" />
                                            <span><f:translate key="license-activation.btn-activate" extensionName="ns_license" /></span>
                                        </f:form.button>
                                    </div>
                                </f:form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <f:if condition="{extensions.premium} || {extensions.free}">
                <f:then><f:render partial="Extensions" arguments="{_all}" /></f:then>
                <f:else><p class="mt-3 text-variant"><f:translate key="fetchData.error.no_license_keys" /></p></f:else>
            </f:if>
        </div>

        <!-- AI Universe Tab Pane -->
        <div class="tab-pane fade" id="ai-universe-pane" role="tabpanel" aria-labelledby="ai-universe-tab"
             data-catalog-tab="ai-universe"
             data-catalog-url="{f:uri.action(action: 'getCatalogData', arguments: {tab: 'ai-universe'}, absolute: 1)}"
             data-loading-label="{f:translate(key: 'license-loading.catalog')}"
             data-error-url-not-found="{f:translate(key: 'license-loading.error.catalog-url-not-found')}"
             data-error-failed="{f:translate(key: 'license-loading.error.catalog-failed')}"
             data-error-loading="{f:translate(key: 'license-loading.error.catalog-error')}">
            <div class="catalog-loading-placeholder text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden"><f:translate key="license-loading.loading" /></span>
                </div>
                <p class="mt-3 text-variant"><f:translate key="license-loading.catalog" /></p>
            </div>
            <div class="catalog-content" style="display: none;"></div>
        </div>

        <!-- Extensions Catalog Tab Pane -->
        <div class="tab-pane fade" id="extensions-catalog-pane" role="tabpanel" aria-labelledby="extensions-catalog-tab"
             data-catalog-tab="extensions"
             data-catalog-url="{f:uri.action(action: 'getCatalogData', arguments: {tab: 'extensions'}, absolute: 1)}"
             data-loading-label="{f:translate(key: 'license-loading.catalog')}"
             data-error-url-not-found="{f:translate(key: 'license-loading.error.catalog-url-not-found')}"
             data-error-failed="{f:translate(key: 'license-loading.error.catalog-failed')}"
             data-error-loading="{f:translate(key: 'license-loading.error.catalog-error')}">
            <div class="catalog-loading-placeholder text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden"><f:translate key="license-loading.loading" /></span>
                </div>
                <p class="mt-3 text-variant"><f:translate key="license-loading.catalog" /></p>
            </div>
            <div class="catalog-content" style="display: none;"></div>
        </div>

        <!-- Templates Tab Pane -->
        <div class="tab-pane fade" id="templates-pane" role="tabpanel" aria-labelledby="templates-tab"
             data-catalog-tab="templates"
             data-catalog-url="{f:uri.action(action: 'getCatalogData', arguments: {tab: 'templates'}, absolute: 1)}"
             data-loading-label="{f:translate(key: 'license-loading.catalog')}"
             data-error-url-not-found="{f:translate(key: 'license-loading.error.catalog-url-not-found')}"
             data-error-failed="{f:translate(key: 'license-loading.error.catalog-failed')}"
             data-error-loading="{f:translate(key: 'license-loading.error.catalog-error')}">
            <div class="catalog-loading-placeholder text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden"><f:translate key="license-loading.loading" /></span>
                </div>
                <p class="mt-3 text-variant"><f:translate key="license-loading.catalog" /></p>
            </div>
            <div class="catalog-content" style="display: none;"></div>
        </div>

        <!-- All Licenses Tab Pane -->
        <div class="tab-pane fade" id="all-licenses-pane" role="tabpanel" aria-labelledby="all-licenses-tab">
            <f:render partial="AllLicenses" arguments="{_all}" />
        </div>
    </div>
</f:section>
</html>
