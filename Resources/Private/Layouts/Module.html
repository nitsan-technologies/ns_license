<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
 xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
    <div class="module {moduleClass} ns-license-module-wrapper ns-license-module-shell" data-module-id="{moduleId}" data-module-name="{moduleName}">

        <f:render partial="DocHeader" arguments="{_all}" optional="true" />

        <div class="module-body t3js-module-body ns-license-module">
            <div class="module-body-container t3js-module-body-container">
                <!-- License loader overlay (shown on form submit / reload) -->
                <div id="nsLicenseLoader" class="ns-license-loader" style="display: none;" aria-hidden="true">
                    <div class="t3js-icon">
                        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <f:flashMessages />
                <div class="ns-license-module-page">
                    <div class="ns-license-module-content">
                        <f:render section="Content" arguments="{_all}" optional="true" />
                    </div>
                </div>
            </div>
        </div>

        <div class="module-footer t3js-module-footer ns-license-module-footer">
            <div class="ns-license-module-footer__inner d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="footer-links-left">
                    <span class="text-variant">
                        <f:translate key="license-footer.developed-by.prefix" extensionName="ns_license" />
                        <a class="btn btn-link p-0"
                           href="{f:translate(key: 'license-footer.developed-by.link', extensionName: 'ns_license')}"
                           target="_blank"
                           rel="noopener noreferrer">
                            <f:translate key="license-footer.developed-by.brand" extensionName="ns_license" />
                        </a>
                    </span>
                </div>
                <ul class="footer-links list-unstyled mb-0 d-flex flex-wrap align-items-center">
                    <li>
                        <a class="btn btn-link p-0" href="{f:translate(key: 'license-footer.about.link', extensionName: 'ns_license')}" target="_blank" rel="noopener noreferrer">
                            <f:translate key="license-footer.about" extensionName="ns_license" />
                        </a>
                    </li>
                    <li>
                        <a class="btn btn-link p-0" href="https://app.supademo.com/showcase/cmmyt7j5c0075wy0imx44tkvn?utm_source=link" target="_blank" rel="noopener noreferrer">
                            <f:translate key="license-footer.demo" extensionName="ns_license" />
                        </a>
                    </li>
                    <li>
                        <a class="btn btn-link p-0" href="https://docs.t3planet.de/en/latest/License/Index.html" target="_blank" rel="noopener noreferrer">
                            <f:translate key="license-footer.documentation" extensionName="ns_license" />
                        </a>
                    </li>
                    <li>
                        <a class="btn btn-link p-0" href="https://t3planet.de/en/support" target="_blank" rel="noopener noreferrer">
                            <f:translate key="license-footer.support" extensionName="ns_license" />
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <f:render partial="DomainsModal" arguments="{_all}" optional="true" />
        <f:render partial="GetLicenseModal" arguments="{_all}" optional="true" />
        <f:render partial="RenewModal" arguments="{_all}" optional="true" />
        <!-- Help widget: fixed bottom-right -->
        <div class="ns-license-help-widget">
            <button type="button" class="ns-license-help-widget__trigger btn btn-primary rounded-circle p-0 shadow" aria-label="{f:translate(key: 'license-help-widget.aria-label', extensionName: 'ns_license')}" aria-expanded="false" aria-haspopup="true" aria-controls="ns-license-help-widget-popover" data-help-widget-trigger="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"></path></svg>
            </button>
            <div id="ns-license-help-widget-popover" class="ns-license-help-widget__popover shadow-lg border p-0" data-help-widget-popover="true">
                <div class="p-3 border-bottom">
                    <h2 class="mb-1"><f:translate key="license-help-widget.title" extensionName="ns_license" /></h2>
                    <p class="small text-variant mb-0"><f:translate key="license-help-widget.description" extensionName="ns_license" /></p>
                </div>
                <div class="ns-license-help-widget__list">
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="https://t3planet.de/en/" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-message" size="small" />
                        <f:translate key="license-help-widget.live-chat" extensionName="ns_license" />
                    </a>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="https://docs.t3planet.de/en/latest/License/Index.html" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-document" size="small" />
                        <f:translate key="license-help-widget.knowledge-base" extensionName="ns_license" />
                    </a>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="https://t3planet.de/en/contact" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-envelope" size="small" />
                        <f:translate key="license-help-widget.email-support" extensionName="ns_license" />
                    </a>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="https://www.trustpilot.com/evaluate/t3terminal.com" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-check" size="small" />
                        <f:translate key="license-help-widget.rate-us" extensionName="ns_license" />
                    </a>
                </div>
            </div>
        </div>
    </div>
</html>
